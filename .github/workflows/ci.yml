name: DataLens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax & Lint Verification
        run: |
          python3 -m py_compile scripts/heartbeat_worker.py
          python3 -m py_compile scripts/memory_allocator_test.py
          bash -n scripts/storage_monitor.sh

      - name: Validate Systemd Unit Limits
        run: |
          grep "MemoryMax=64M" systemd/datalens.service
          grep "CPUQuota=20%" systemd/datalens.service
